services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: ["./migrate", "-cmd", "up"]
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["./app"]
    env_file: .env.docker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed

volumes:
  pgdata: